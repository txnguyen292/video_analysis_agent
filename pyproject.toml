[project]
name = "video-agent-workspace"
version = "0.0.0"
description = "Workspace root for video agent packages"
requires-python = ">=3.12"
dependencies = [
    "personal-assistant",
    "personal-assistant-ui",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.25.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
    "types-PyYAML>=6.0.12.20240917",
]

[project.scripts]
video-agent-checks = "personal_assistant.devtools:run_workspace_checks"
personal-assistant-checks = "personal_assistant.devtools:run_checks"
personal-assistant-ui-checks = "personal_assistant_ui.devtools:run_checks"

[tool.uv.workspace]
members = ["core", "ui"]

[tool.uv.sources]
personal-assistant = { workspace = true }
personal-assistant-ui = { workspace = true }

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
markers = [
  "unit: unit tests",
  "integration: integration tests",
  "adk: ADK agent tests",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
]

[tool.mypy]
check_untyped_defs = true

[[tool.mypy.overrides]]
# Flet does not publish type stubs, so we must ignore missing imports
module = "flet"
ignore_missing_imports = true
