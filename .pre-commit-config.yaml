repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff Check
        entry: uv run ruff check --force-exclude --fix
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format
        name: Ruff Format
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]
        require_serial: true

      - id: mypy
        name: Mypy
        entry: uv run mypy core/src ui/src
        language: system
        types: [python]
        pass_filenames: false # Run on the whole project to ensure type context is correct
        require_serial: true
